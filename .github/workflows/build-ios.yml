name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure iOS platform scaffold
        run: |
          if [ ! -d "ios" ]; then
            echo "Scaffolding iOS project..."
            flutter create --platforms=ios --project-name=neofocus_camera --org tw.neofocus .
          fi

      - name: Configure iOS Camera, Mic & Photo Permissions in Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Injecting Camera, Microphone & Photo permissions into Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '錄影時需要存取麥克風錄音'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '錄影時需要存取麥克風錄音'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'NeoFocus 需要存取相簿以儲存您拍攝的高畫質照片'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'NeoFocus 需要存取相簿以儲存您拍攝的高畫質照片'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'NeoFocus 需要存取相簿以顯示最後拍攝的照片縮圖'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'NeoFocus 需要存取相簿以顯示最後拍攝的照片縮圖'" "$PLIST"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Xcode Project for Unsigned Build
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            # 1. 切換為手動簽名 (Manual)
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX" || true
            # 2. 注入 10 碼虛擬 Team ID (滿足 Flutter 實機前置檢查) 並關閉簽名
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = tw.neofocus.neofocusCamera;/PRODUCT_BUNDLE_IDENTIFIER = tw.neofocus.neofocusCamera; DEVELOPMENT_TEAM = DUMMY12345; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' "$PBX" || true
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBX" || true
          fi
          
          # 3. 透過 Release.xcconfig 全域關閉簽署驗證
          CONFIG="ios/Flutter/Release.xcconfig"
          if [ -f "$CONFIG" ]; then
            echo "DEVELOPMENT_TEAM=DUMMY12345" >> "$CONFIG"
            echo "CODE_SIGNING_ALLOWED=NO" >> "$CONFIG"
            echo "CODE_SIGNING_REQUIRED=NO" >> "$CONFIG"
            echo "CODE_SIGN_IDENTITY=" >> "$CONFIG"
            echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "$CONFIG"
          fi

      - name: Build iOS App without code signing
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 ../../../app-release.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
          retention-days: 14
