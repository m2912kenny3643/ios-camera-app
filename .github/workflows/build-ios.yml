name: Build EOS R6 Mark III iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project from project.yml
        run: xcodegen generate

      - name: Build iOS Application (Unsigned)
        run: |
          xcodebuild build \
            -project EOSR6MarkIII.xcodeproj \
            -scheme EOSR6MarkIII \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .app into Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -9 EOSR6MarkIII.ipa Payload
          cd ..
          ls -la build/EOSR6MarkIII.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOSR6MarkIII-Unsigned-IPA
          path: build/EOSR6MarkIII.ipa
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0-release
          name: EOS R6 Mark III iOS Camera v1.0.0
          body: |
            ## Canon EOS R6 Mark III for iOS
            ### 新功能與亮點：
            - **硬體相機按鍵深度支援**：iOS 18+ Camera Control 兩段式快門（半按鎖定對焦 AF/AE，全按釋放拍攝，電容滑動變焦與參數調整）。
            - **經典 R63 介面復刻**：3:2 取景片幅、頂部狀態列、底部經典曝光標尺 (-3..0..+3)、電子水平儀。
            - **速控選單 (Q-Menu)**：點擊 [Q] 即時彈出雙欄/矩陣選單調整 AF、測光、白平衡、相片風格。
            - **Canon 相片風格**：標準 (Standard)、人像 (Portrait)、風景 (Landscape)、單色 (Monochrome)。
            - **支援安裝方式**：AltStore、SideStore、TrollStore、Sideloadly。
          files: build/EOSR6MarkIII.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
