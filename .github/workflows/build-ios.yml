name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure iOS platform scaffold
        run: |
          if [ ! -d "ios" ]; then
            echo "Scaffolding iOS project..."
            flutter create --platforms=ios --project-name=neofocus_camera --org tw.neofocus .
          fi

      - name: Inject Apple Neural Engine Vision Engine into Runner
        run: |
          if [ -f "ios_custom/AppDelegate.swift" ]; then
            echo "Injecting native Apple Vision / Neural Engine tracking into ios/Runner/AppDelegate.swift..."
            cp -f ios_custom/AppDelegate.swift ios/Runner/AppDelegate.swift
          fi

      - name: Configure iOS Camera, Mic & Photo Permissions in Info.plist
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          PLIST="ios/Runner/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Injecting Camera, Microphone & Photo permissions into Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景 (Camera access required for viewfinder and manual focus)'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景 (Camera access required for viewfinder and manual focus)'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '錄影時需要存取麥克風錄音 (Microphone access required for recording)'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '錄影時需要存取麥克風錄音 (Microphone access required for recording)'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'NeoFocus 需要存取相簿以儲存您拍攝的高畫質照片 (Photo library access required to save photos)'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'NeoFocus 需要存取相簿以儲存您拍攝的高畫質照片 (Photo library access required to save photos)'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'NeoFocus 需要存取相簿以顯示最後拍攝的照片縮圖 (Photo library access required to view photos)'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'NeoFocus 需要存取相簿以顯示最後拍攝的照片縮圖 (Photo library access required to view photos)'" "$PLIST"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Xcode Project for Unsigned Build
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX" || true
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = tw.neofocus.neofocusCamera;/PRODUCT_BUNDLE_IDENTIFIER = tw.neofocus.neofocusCamera; DEVELOPMENT_TEAM = DUMMY12345; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' "$PBX" || true
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBX" || true
          fi
          
          CONFIG="ios/Flutter/Release.xcconfig"
          if [ -f "$CONFIG" ]; then
            echo "DEVELOPMENT_TEAM=DUMMY12345" >> "$CONFIG"
            echo "CODE_SIGNING_ALLOWED=NO" >> "$CONFIG"
            echo "CODE_SIGNING_REQUIRED=NO" >> "$CONFIG"
            echo "CODE_SIGN_IDENTITY=" >> "$CONFIG"
            echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "$CONFIG"
          fi

      - name: Extract Dynamic Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build iOS App without code signing
        run: |
          flutter build ios --release --no-codesign --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUMBER }}

      - name: Package .app into Versioned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 ../../../NeoFocus-v${{ env.VERSION }}.ipa Payload
          cd ../../..
          cp NeoFocus-v${{ env.VERSION }}.ipa NeoFocus-v${{ env.VERSION }}-b${{ env.BUILD_NUMBER }}.ipa
          cp NeoFocus-v${{ env.VERSION }}.ipa NeoFocus-latest.ipa
          cp NeoFocus-v${{ env.VERSION }}.ipa app-release.ipa

      - name: Upload Versioned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoFocus-v${{ env.VERSION }}-b${{ env.BUILD_NUMBER }}-ipa
          path: NeoFocus-v${{ env.VERSION }}-b${{ env.BUILD_NUMBER }}.ipa
          retention-days: 14

      - name: Upload Standard IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
          retention-days: 14
