name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure iOS platform scaffold
        run: |
          if [ ! -d "ios" ]; then
            echo "Scaffolding iOS project..."
            flutter create --platforms=ios --org tw.neofocus .
          fi

      - name: Configure iOS Camera & Mic Permissions in Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Injecting Camera & Microphone permissions into Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '錄影時需要存取麥克風錄音'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '錄影時需要存取麥克風錄音'" "$PLIST"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App without code signing
        run: flutter build ios --release --no-codesign

      - name: Package .app into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 ../../../app-release.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
          retention-days: 14
