name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure iOS platform scaffold
        run: |
          if [ ! -d "ios" ]; then
            echo "Scaffolding iOS project..."
            flutter create --platforms=ios --project-name=neofocus_camera --org tw.neofocus .
          fi

      - name: Configure iOS Camera & Mic Permissions in Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Injecting Camera & Microphone permissions into Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'NeoFocus 相機需要存取鏡頭以提供手動專業對焦與即時取景'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '錄影時需要存取麥克風錄音'" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription '錄影時需要存取麥克風錄音'" "$PLIST"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Podfile for Xcode 16 & iOS 14+
        run: |
          cd ios
          # 若沒有 Podfile 先行生成
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          # 設定最低版本為 iOS 14.0，並強制關閉所有 Pods 的程式碼簽署驗證
          cat << 'EOF' > Podfile
          platform :ios, '14.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get has executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ""
                config.build_settings['CODE_SIGNING_IDENTITY'] = ""
              end
            end
          end
          EOF
          cd ..

      - name: Disable Code Signing in Xcode Project & xcconfig
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX" || true
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBX" || true
            sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBX" || true
          fi
          
          # 透過 Release.xcconfig 強制 Xcode 關閉簽署驗證與 Team 檢查
          CONFIG="ios/Flutter/Release.xcconfig"
          if [ -f "$CONFIG" ]; then
            echo "CODE_SIGNING_ALLOWED=NO" >> "$CONFIG"
            echo "CODE_SIGNING_REQUIRED=NO" >> "$CONFIG"
            echo "CODE_SIGN_IDENTITY=" >> "$CONFIG"
            echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "$CONFIG"
          fi

      - name: Build iOS App without code signing
        run: |
          flutter build ios --release --no-codesign --verbose

      - name: Package .app into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 ../../../app-release.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.ipa
          retention-days: 14
